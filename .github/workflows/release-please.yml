name: Release Please

on:
  # A release is cut when a human merges the platform-managed release PR into
  # main (the PR's base, so its diff shows the full pending release).
  # Every other push here runs release-please as well — commits written straight to
  # this branch included — and cuts nothing, there being no release commit at the tip.
  push:
    branches:
      - main
    # The Scalar platform pushes these workflow files straight to main to keep them
    # current between releases; that is bookkeeping, never a release. Running anyway is worse
    # than pointless on a branch that has not been handed a .release-please-manifest.json yet —
    # release-please fails the run outright when it cannot read one. A release commit always
    # rewrites the manifest and the changelog, so this filter can never swallow one.
    paths-ignore:
      - '.github/workflows/**'
  # Manual fallback only; nothing in the automated chain depends on dispatch.
  workflow_dispatch:

permissions:
  contents: write
  # Required to update the merged release PR's autorelease labels after tagging.
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # Consumed by the publish job's checkout: without this mapping the checkout ref would be
      # empty and the publish would build the triggering branch head instead of the released
      # tag's exact commit.
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Release PRs are opened and updated by the Scalar platform with its own
          # credential (so their CI runs without manual approval); this workflow only
          # cuts the tag + GitHub Release once a release PR is merged.
          skip-github-pull-request: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          fetch-depth: 0
      # Merging the release PR into main is itself the promotion, but the
      # version bump and changelog must also land back on scalar-next, or the next
      # release PR would propose this release again. A real merge (never a plain
      # commit push) so a squash- or rebase-merged release PR syncs just as well; the
      # non-conventional message keeps the sync commit out of future changelogs.
      #
      # The Scalar platform merges main into scalar-next itself when the release
      # PR merges, so this step routinely races it. The sync is done once the release commit
      # is an ancestor of scalar-next, whoever merged it, so that is checked before every
      # attempt. A rejected push retries from a fresh fetch rather than failing the release
      # run. Plain (non-force) push on purpose: a concurrent regeneration push is never
      # discarded, and a sync that still cannot land after the retries fails loudly.
      - name: Sync release back to scalar-next
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit `|| return 1`s because `set -e` does not apply inside a function called
          # as a condition, and a failed merge must never fall through to a no-op push.
          sync_release() {
            git fetch origin scalar-next || return 1
            if git merge-base --is-ancestor "$RELEASE_SHA" origin/scalar-next; then
              echo "$RELEASE_TAG is already on scalar-next."
              return 0
            fi
            git checkout -B scalar-next origin/scalar-next || return 1
            if ! git merge --no-edit -m "Sync release $RELEASE_TAG back to scalar-next" "$RELEASE_SHA"; then
              git merge --abort
              return 1
            fi
            git push origin scalar-next
          }
          for attempt in 1 2 3; do
            if sync_release; then exit 0; fi
            echo "Attempt $attempt of 3 to sync $RELEASE_TAG back to scalar-next failed."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "::error::Could not sync $RELEASE_TAG back to scalar-next after 3 attempts."
          exit 1
  publish:
    needs: release-please
    # `!cancelled()` keeps publishing even when the back-sync to the integration branch
    # failed: a raced integration branch must not block the release from reaching its
    # registry.
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's release-cutting grants with the publish
    # floor. OIDC trusted publishing verifies this run's claims, which name this workflow
    # file — register release-please.yml as the trusted publisher on the registry.
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      VERSIONING_POLICY: manual
    steps:
      # Publishing runs inline — a top-level job of this same run — rather than dispatching
      # sdk-release.yml: workflow_dispatch resolves the target workflow on the repository's
      # default branch only, so a dispatch would 404 whenever the release line is any other
      # branch, while OIDC trusted publishing accepts this job because it stays top-level
      # (never a reusable-workflow call). The release-please job cut the tag earlier in this
      # run; checking it out publishes exactly the released commit, not the branch head that
      # triggered the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      # The version is owned by release tooling in this repository, never by the SDK generator,
      # so the asset and Homebrew steps read it from package.json at run time.
      - name: Read package version
        run: echo "PKG_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      # `bun build --compile` embeds the Bun runtime and every dependency in the executable, so the
      # published artifacts run on a machine with no Node, no Bun, and no `node_modules` — unlike the
      # npm package, which stays a normal Node CLI. Bun cross-compiles every target from this one
      # Linux runner by downloading the matching runtime, so the matrix needs no extra jobs.
      #
      # The compile reads `src/bin.ts` rather than the `tsc` output in `dist/`: Bun bundles
      # TypeScript directly, and going through `dist/` would only add the emitted ESM specifier
      # rewriting as a failure mode between the source and the shipped binary.
      #
      # Each target compiles into its own `compile-out/<target>/` directory rather than straight
      # into an archive, so anything that has to touch an executable can run as a step between this
      # one and packaging — code signing, when it is configured — and the archive is always built
      # from whatever those steps left behind.
      - name: Compile standalone binaries
        run: |
          rm -rf compile-out
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            mkdir -p "compile-out/${target}"
            case "$target" in
              windows-*)
                bun build src/bin.ts --compile --minify --target="bun-${target}" --outfile "compile-out/${target}/scalargalaxy.exe"
                ;;
              *)
                bun build src/bin.ts --compile --minify --target="bun-${target}" --outfile "compile-out/${target}/scalargalaxy"
                ;;
            esac
          done
      # Asset names carry no version: the release tag in the download path already does, and a
      # stable file name is what makes `releases/latest/download/<name>` resolve, so install
      # instructions can point at "latest" without being rewritten every release.
      #
      # Each tarball carries the generated man pages beside the executable, so Homebrew — and anyone
      # unpacking the download — installs `man scalargalaxy` too rather than only the npm package doing
      # so. Windows has no `man`, so its zip stays the executable alone.
      #
      # They are copied in here rather than at compile time so that what any signing step above saw
      # — and, when notarization is on, what was uploaded to Apple, which zips these directories
      # whole — is the executables alone.
      - name: Package release archives
        run: |
          ROOT="$PWD"
          mkdir -p release-binaries
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            case "$target" in
              windows-*)
                (cd "compile-out/${target}" && zip -q "$ROOT/release-binaries/scalargalaxy-${target}.zip" "scalargalaxy.exe")
                ;;
              *)
                cp -R "man" "compile-out/${target}/man"
                tar -czf "release-binaries/scalargalaxy-${target}.tar.gz" -C "compile-out/${target}" "scalargalaxy" "man"
                ;;
            esac
          done
          rm -rf compile-out
      - name: Attach binaries to the release
        run: gh release upload "v${PKG_VERSION}" release-binaries/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
